<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Contract Reviewer{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'webreview/report.css' %}">
</head>
<body>
    <header class="site-header">
        <a href="{% url 'webreview:summarise' %}" class="site-title">Contract Reviewer</a>
        <nav class="site-nav">
            <a href="{% url 'webreview:full_stack' %}" class="{% if request.resolver_match.url_name == 'full_stack' %}active{% endif %}">Full Stack Development</a>
            <a href="{% url 'webreview:nlp' %}" class="{% if request.resolver_match.url_name == 'nlp' %}active{% endif %}">Natural Language Processing</a>
            <a href="{% url 'webreview:summarise' %}" class="{% if request.resolver_match.url_name == 'summarise' %}active{% endif %}">Summarise</a>
        </nav>
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
