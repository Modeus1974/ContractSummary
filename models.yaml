tiers:
  efficient:
    provider: anthropic
    model: claude-haiku-4-5-20251001
  balanced:
    provider: anthropic
    model: claude-sonnet-5
  flagship:
    provider: anthropic
    model: claude-opus-5

# Override any tier from the shell/`.env` without editing this file, e.g.:
#   MODEL_TIER_EFFICIENT_PROVIDER=openai
#   MODEL_TIER_EFFICIENT_MODEL=gpt-5.4-mini
